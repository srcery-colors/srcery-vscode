name: Prepare release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - uses: MindTooth/setup@fix/prefer-locked-pnpm
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare version and changelog
        env:
          INCREMENT: ${{ inputs.increment }}
        run: pnpm release:prepare "$INCREMENT"
      - name: Read version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: release/next
          draft: always-true
          commit-message: 'chore: prepare release ${{ steps.version.outputs.version }}'
          title: 'chore: prepare release ${{ steps.version.outputs.version }}'
          body: |
            Update the extension version and finalize the Keep a Changelog entries.

            Review the version, release date, and changelog, then mark this PR ready to run CI.
            After merging, push the corresponding version tag on the reviewed master commit to publish the GitHub release.
          add-paths: |
            package.json
            pnpm-lock.yaml
            CHANGELOG.md
