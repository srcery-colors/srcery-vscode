name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm biome:ci
      - run: pnpm check:theme
      - run: pnpm package
