name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Grant no default token permissions; each job declares its required scopes.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # contents: read checks out the workflows and their action lockfile.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-slim
    # contents: read checks out the workflows for auditing.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false

  check:
    needs: [lockfile, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    # contents: read checks out source for validation and packaging.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          npm_config_ignore_scripts: "true"
        with:
          cache: true
          require-lockfile: true
      - run: pnpm biome:ci
      - run: pnpm check:theme
      - run: pnpm package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: srcery-vsix
          path: srcery-colors-*.vsix
          if-no-files-found: error

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    # Block all cache restores and saves, including pnpm/setup's verification cache.
    cache-mode: none
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # Writes use the srcery-bot App token, not the workflow token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          npm_config_ignore_scripts: "true"
        with:
          cache: false
          require-lockfile: true
      - id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # Create release commits, tags, and drafts.
          permission-actions: write # Dispatch publication at the new tag.
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
