name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm biome:ci
      - run: pnpm check:theme
      - run: pnpm package
      - name: Verify VSIX
        shell: bash
        run: |
          set -euo pipefail
          vsix="srcery-colors-$(node -p 'require("./package.json").version').vsix"
          unzip -t "$vsix" > /dev/null

          # Update this list when the extension intentionally adds or removes assets.
          diff -u <(LC_ALL=C sort <<'EOF'
          [Content_Types].xml
          extension.vsixmanifest
          extension/LICENSE.txt
          extension/changelog.md
          extension/package.json
          extension/readme.md
          extension/assets/Screenshot_v0.3.3.png
          extension/assets/Screenshot_v0.3.3_peek.png
          extension/assets/icon.png
          extension/assets/scope_inspector_go.png
          extension/assets/title.png
          extension/themes/Srcery-color-theme.json
          extension/themes/srcery.tmTheme
          EOF
          ) <(unzip -Z1 "$vsix" | LC_ALL=C sort)

          unzip -p "$vsix" extension/package.json | cmp - package.json
          unzip -p "$vsix" extension/themes/Srcery-color-theme.json | cmp - themes/Srcery-color-theme.json
          unzip -p "$vsix" extension/themes/srcery.tmTheme | cmp - themes/srcery.tmTheme
          unzip -p "$vsix" extension/assets/icon.png | cmp - assets/icon.png
          sha256sum "$vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: srcery-vsix
          path: srcery-colors-*.vsix
          if-no-files-found: error
