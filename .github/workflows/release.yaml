name: GitHub release

on:
  workflow_call:
  workflow_dispatch:

# Grant no default token permissions; each job declares its required scopes.
permissions: {}

# Block all cache restores and saves, including pnpm/setup's verification cache.
cache-mode: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write creates release commits, tags, and drafts; actions: write dispatches publication.
    permissions:
      contents: write # Create release commits, tags, and drafts.
      actions: write # Dispatch publication at the new tag.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          npm_config_ignore_scripts: "true"
        with:
          cache: false
          require-lockfile: true
      - run: pnpm release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}

  verify:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: write is needed to read draft releases.
    permissions:
      contents: write # Needed to read draft releases.
    outputs:
      pending: ${{ steps.version.outputs.pending }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and draft
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          pending=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    if: needs.verify.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: read checks out source; id-token: write and attestations: write create VSIX provenance.
    permissions:
      contents: read
      id-token: write # Sign VSIX provenance with OIDC.
      attestations: write # Store VSIX provenance.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          npm_config_ignore_scripts: "true"
        with:
          cache: false
          require-lockfile: true
      - run: pnpm biome:ci && pnpm check:theme
      - name: Package VSIX
        run: |
          pnpm package
          test -f "srcery-colors-${GITHUB_REF_NAME#v}.vsix"
      - name: Attest VSIX
        uses: actions/attest@v4.2.2
        with:
          subject-path: srcery-colors-*.vsix
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: github-release
          path: srcery-colors-*.vsix
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: needs.verify.outputs.pending == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read downloads the VSIX; attestations: read verifies provenance; contents: write publishes the draft.
    permissions:
      actions: read # Download the built VSIX.
      attestations: read # Verify VSIX provenance.
      contents: write # Upload the VSIX and publish the draft.
    steps:
      - name: Verify and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -n github-release -D release
          file="release/srcery-colors-${GITHUB_REF_NAME#v}.vsix"
          test -s "$file"
          gh attestation verify "$file" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" "$file" -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
